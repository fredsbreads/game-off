html/head_include="<meta name=\"viewport\" content=\"width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<script>(function(){function fit(){var c=document.getElementById('canvas');if(!c)return;var w=window.innerWidth,h=window.innerHeight,d=window.devicePixelRatio||1;var touch=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;var rot=touch&&h>w;var cw=rot?h:w,ch=rot?w:h;c.style.position='absolute';c.style.left='0px';c.style.top='0px';c.style.width=cw+'px';c.style.height=ch+'px';c.width=Math.round(cw*d);c.height=Math.round(ch*d);c.style.transformOrigin='0 0';c.style.transform=rot?('translate('+w+'px,0px) rotate(90deg)'):'none';window.redFlashRotated=rot;}window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,150);});document.addEventListener('DOMContentLoaded',fit);})();</script>"
