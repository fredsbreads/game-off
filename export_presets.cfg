html/head_include="<meta name=\"viewport\" content=\"width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<script>(function(){var flip=false;try{flip=localStorage.getItem('redFlashFlip')==='1';}catch(e){}window.redFlashFlip=flip;window.redFlashSetFlip=function(v){window.redFlashFlip=!!v;try{localStorage.setItem('redFlashFlip',v?'1':'0');}catch(e){}fit();};function fit(){var c=document.getElementById('canvas');if(!c)return;var w=window.innerWidth,h=window.innerHeight,d=window.devicePixelRatio||1;var touch=window.matchMedia&&window.matchMedia('(pointer: coarse)').matches;var rot=touch&&h>w;var cw=rot?h:w,ch=rot?w:h;c.style.position='absolute';c.style.left='0px';c.style.top='0px';c.style.width=cw+'px';c.style.height=ch+'px';c.width=Math.round(cw*d);c.height=Math.round(ch*d);c.style.transformOrigin='0 0';c.style.transform=rot?(window.redFlashFlip?('translate(0px,'+h+'px) rotate(-90deg)'):('translate('+w+'px,0px) rotate(90deg)')):'none';window.redFlashRotated=rot;window.redFlashNeedPortrait=touch&&w>h;}window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,150);});document.addEventListener('DOMContentLoaded',fit);})();</script>\n<script>(function(){try{if(navigator.audioSession){navigator.audioSession.type='playback';}}catch(e){}var C=window.AudioContext||window.webkitAudioContext;if(!C)return;var all=[];function W(a,b){var c=b===undefined?(a===undefined?new C():new C(a)):new C(a,b);all.push(c);c.addEventListener('statechange',function(){note('state '+c.state);});return c;}W.prototype=C.prototype;window.AudioContext=W;if(window.webkitAudioContext)window.webkitAudioContext=W;window.redFlashAudio=all;function wake(){try{if(navigator.audioSession&&navigator.audioSession.type!=='playback'){navigator.audioSession.type='playback';}}catch(e){}if(document.hidden)return;all.forEach(function(c){if(c.state!=='running'&&c.state!=='closed'){c.resume().catch(function(){});}});}function sleep(){all.forEach(function(c){if(c.state==='running'){c.suspend().catch(function(){});}});}var me=Math.random().toString(36).slice(2),quiet=false,bc=null;try{bc=new BroadcastChannel('redFlash');}catch(e){}function claim(){quiet=false;if(bc){try{bc.postMessage(me);}catch(e){}}}if(bc){bc.onmessage=function(e){if(e.data===me)return;quiet=true;sleep();if(window.rfBeat){window.rfBeat('another copy of the game took over the sound');}};}function touched(){claim();wake();}['touchend','pointerup','mouseup','keydown','click'].forEach(function(e){document.addEventListener(e,touched,true);});document.addEventListener('visibilitychange',function(){if(document.hidden){sleep();}else if(!quiet){wake();}});window.addEventListener('pagehide',sleep);window.addEventListener('pageshow',function(){if(!quiet)wake();});window.addEventListener('focus',function(){if(!quiet)wake();});claim();var log=[];function note(s){log.push(s);if(log.length>4)log.shift();}if(location.hash.indexOf('audio')>=0){var d=document.createElement('div');d.style.cssText='position:fixed;left:4px;top:4px;z-index:9;color:#0f0;font:11px monospace;background:rgba(0,0,0,.6);padding:3px;pointer-events:none;white-space:pre';document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(d);});var t0=0,a0=0;setInterval(function(){var c=all[0];if(!c){d.textContent='no audio yet';return;}var now=performance.now()/1000;var drift='';if(c.state==='running'){if(!t0){t0=now;a0=c.currentTime;}drift=((now-t0)-(c.currentTime-a0)).toFixed(2);}else{t0=0;}d.textContent='audio '+c.state+' rate '+c.sampleRate+'\\nbase '+(c.baseLatency||0).toFixed(3)+' out '+(c.outputLatency||0).toFixed(3)+'\\nclock drift '+drift+'\\n'+log.join('\\n');},500);}})();</script>"
